<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 - CSS Hover & Transition</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Bài 1: Nút bấm đổi màu mượt khi hover -->
    <section class="buttons">
        <button class="btn">Nút 1</button>
        <button class="btn">Nút 2</button>
        <button class="btn">Nút 3</button>
    </section>

    <!-- Bài 2: Ảnh phóng to nhẹ khi hover -->
    <section class="gallery">
        <figure><img src="GD.png" alt="Image 1"></figure>
        <figure><img src="https://via.placeholder.com/400" alt="Image 2"></figure>
        <figure><img src="https://via.placeholder.com/400" alt="Image 3"></figure>
        <figure><img src="https://via.placeholder.com/400" alt="Image 4"></figure>
    </section>

    <!-- Bài 3: Menu điều hướng có hiệu ứng underline chạy ngang -->
    <section class="menu">
        <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Blog</a></li>
        </ul>
    </section>

    <!-- Bài 4: Card sản phẩm "nổi lên" khi hover -->
    <section class="cards">
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Product 1">
            <h3>Product 1</h3>
            <p>$20</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Product 2">
            <h3>Product 2</h3>
            <p>$25</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Product 3">
            <h3>Product 3</h3>
            <p>$30</p>
        </div>
    </section>

    <!-- Bài 5: Banner chữ hiện dần khi tải trang -->
    <section class="banner">
        <h1 class="hero-title">Chào mừng đến với website của tôi</h1>
    </section>

</body>
</html>
