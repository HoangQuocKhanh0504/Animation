<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Thư Mục - Animation</title>
  <link rel="icon" href="GD.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 800px;
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #4A90E2;
      font-size: 2.5rem;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .directory-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .directory-item {
      background-color: #fff;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .directory-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .directory-item a {
      text-decoration: none;
      color: #333;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.3s ease-in-out;
    }

    .directory-item a:hover {
      color: #007bff;
    }

    .icon {
      font-size: 1.5rem;
      color: #007bff;
      margin-left: 10px;
      transition: color 0.3s ease-in-out;
    }

    .icon:hover {
      color: #0056b3;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Danh Sách Thư Mục trong Repository Animation</h1>
    <ul class="directory-list" id="directory-list">
      <!-- Danh sách thư mục sẽ được chèn vào đây bằng JavaScript -->
    </ul>
  </div>

  <script>
    const apiUrl = 'https://api.github.com/repos/HoangQuocKhanh0504/Animation/contents/';

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const directoryList = document.getElementById('directory-list');

        data.forEach(item => {
          if (item.type === 'dir') {
            const li = document.createElement('li');
            li.classList.add('directory-item');

            const a = document.createElement('a');
            a.href = `https://hoangquockhanh0504.github.io/Animation/${item.name}/`;
            a.textContent = item.name;
            a.target = '_blank'; // Mở trong tab mới

            const icon = document.createElement('span');
            icon.classList.add('icon');
            icon.innerHTML = '📁'; // Icon thư mục

            li.appendChild(a);
            li.appendChild(icon);
            directoryList.appendChild(li);
          }
        });
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        const directoryList = document.getElementById('directory-list');
        directoryList.innerHTML = '<li>Không thể tải danh sách thư mục.</li>';
      });
  </script>

</body>
</html>
